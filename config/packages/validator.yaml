# config/packages/validator.yaml
framework:
    validation:
        email_validation_mode: html5
        
        # Chemins explicites pour les mappings de validation
        mapping:
            paths:
                - '%kernel.project_dir%/src/Account/Domain/Entity'
                - '%kernel.project_dir%/src/Cart/Domain/Entity'
                - '%kernel.project_dir%/src/Discount/Domain/Entity'
                - '%kernel.project_dir%/src/Product/Domain/Entity'

when@test:
    framework:
        validation:
            not_compromised_password: false
